# Example: Cloud Run / Production Configuration
# Uses Cloud SQL PostgreSQL

server:
  address: "0.0.0.0"
  port: 8080

logging:
  level: "info"
  text: false

database:
  driver: "postgres"
  
  # For Cloud SQL, these are set via environment variables:
  # DASHBOARD_DATABASE_CLOUD_SQL_INSTANCE=project:region:instance
  # DASHBOARD_DATABASE_NAME=dashboard
  # DASHBOARD_DATABASE_USER=dashboard-user
  # DASHBOARD_DATABASE_PASSWORD=<from Secret Manager>
  
  # For standard PostgreSQL:
  # url: "postgres://user:password@host:5432/dbname?sslmode=disable"
  
  max_open_conns: 25
  max_idle_conns: 5

cache:
  workflow_ttl: "15m"
  max_entries: 10000

options:
  default_time_window: "12h"
  max_repos_per_page: 50
  enable_realtime: true

# GitHub App credentials loaded from environment variables
github:
  app:
    integration_id: 0  # Set via DASHBOARD_GITHUB_APP_INTEGRATION_ID
    webhook_secret: "" # Set via DASHBOARD_GITHUB_APP_WEBHOOK_SECRET
    private_key: ""    # Set via DASHBOARD_GITHUB_APP_PRIVATE_KEY

# Set DASHBOARD_ALLOWED_USERS and/or DASHBOARD_ALLOWED_ORGANIZATIONS.
# Empty allowlists prevent startup outside demo mode.
access:
  allowed_users: []
  allowed_organizations: []

sessions:
  lifetime: 28800
  secure: true
