version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gh-dashboard-db
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard-user
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard-user -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
