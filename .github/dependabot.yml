---
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: "terraform"
    directories:
      - "/iac/modules/github-actions-dashboard"
      - "/iac/examples/gcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
